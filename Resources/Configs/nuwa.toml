#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xBAB00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 3
# Match the reference author images (e.g. 8650-ennea.img): v3 header,
# no ramdisk (empty), Android 13 era OS version metadata.
os_version     = "13.0.0"
os_patch_level = "2023-04-05"
