name: Build UEFI for nuwa
on:
  push:
    branches: ["main"]
    paths:
      - 'Binaries'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'MuPatches/**'
      - 'Platforms/**'
      - 'Resources/**'
      - 'Silicon/**'
      - 'Silicium-ACPI'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'Binaries'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'MuPatches/**'
      - 'Platforms/**'
      - 'Resources/**'
      - 'Silicon/**'
      - 'Silicium-ACPI'
env:
  CI_BUILD: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build UEFI for nuwa
        run: bash ./setup_env.sh -p apt && python3 ./build_uefi.py -d nuwa -r DEBUG -c -m 0

      - name: Upload UEFI images
        uses: actions/upload-artifact@v7
        with:
          name: uefi-images
          path: ./Mu-*
          compression-level: 9
